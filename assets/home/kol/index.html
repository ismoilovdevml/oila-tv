<!doctype html><html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Oila TV</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Ko'l sohili home. Chrome 66 WebView: no flexbox gap (margins) and no backdrop-filter (plain
   translucency). Focus only toggles a class — no re-render — so it stays smooth. The wallpaper and
   panel tints come from the palette in ?wp=<id>, so one layout gives ten looks (light and dark). */
html,body{margin:0;height:100%;overflow:hidden}
#fit{position:absolute;top:50%;left:50%;width:1920px;height:1080px;transform-origin:center center}
button{all:unset;cursor:pointer;box-sizing:border-box;font-family:inherit}
.hp>*+*{margin-left:28px}.fp>*+*{margin-left:36px}.fh>*+*{margin-left:10px}
.brand>svg{margin-right:12px}.okr>*{margin-right:12px}
.pill{background:var(--glass);border:1px solid var(--glassb);color:var(--ui)}
.sep{background:var(--glassb)}
.ac{height:420px;border-radius:40px;padding:34px;display:flex;flex-direction:column;justify-content:space-between;
  border:1px solid var(--cardb);background:var(--card);transform:translateZ(0)}
.ac .chip{width:100px;height:100px;border-radius:30px;display:flex;align-items:center;justify-content:center}
.ac .nm{font-size:42px;font-weight:700;letter-spacing:-0.02em;color:var(--ui)}
.ac .sub{font-size:20px;font-weight:500;line-height:1.35;color:var(--ui2);margin-top:8px}
.ac .okr{display:none;align-items:center;font-size:19px;font-weight:600;color:#1C4A47}
.ac .okr .b{display:inline-flex;align-items:center;height:32px;padding:0 10px;border-radius:8px;background:#1C4A47;color:#fff;font-size:15px;font-weight:700}
.ac.on{background:var(--onbg);transform:translateY(-14px);box-shadow:0 14px 30px rgba(10,35,38,0.33);border-color:var(--onbd)}
.ac.on .nm{color:#12302E}.ac.on .sub{color:#3B5C59}.ac.on .okr{display:flex}
.sc{height:110px;border-radius:999px;padding:0 34px;display:flex;align-items:center;
  border:1px solid var(--cardb);color:var(--ui);background:var(--card);transform:translateZ(0)}
.sc svg{margin-right:20px;stroke:var(--ic)}
.sc .nm{font-size:24px;font-weight:700}.sc .sub{font-size:17px;font-weight:500;opacity:0.85}
.sc.on{background:var(--onbg);color:#12302E}.sc.on svg{stroke:#1C4A47}
</style></head>
<body>
<div id="fit" style="font-family:'Inter',system-ui,sans-serif;color:#fff">
  <svg id="bg" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true" style="position:absolute;inset:0;transform:translateZ(0)"></svg>
  <header style="position:absolute;left:0;right:0;top:52px;display:flex;justify-content:center">
    <div class="hp pill" style="display:flex;align-items:center;height:84px;padding:0 34px;border-radius:999px">
      <span class="brand" style="display:inline-flex;align-items:center;font-size:24px;font-weight:700">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V20h14V9.5"></path><path d="M10 20v-5h4v5"></path></svg>
        Oila TV
      </span>
      <span class="sep" style="width:1px;height:36px"></span>
      <span id="clock" style="font-size:40px;font-weight:600;letter-spacing:-0.02em">00:00</span>
      <span id="date" style="font-size:20px;font-weight:500;opacity:.85"></span>
      <span class="sep" style="width:1px;height:36px"></span>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 20 0"></path><path d="M5 12.4a10 10 0 0 1 14 0"></path><path d="M8.5 15.9a5 5 0 0 1 7 0"></path><path d="M12 19.5h.01"></path></svg>
    </div>
  </header>
  <section id="apps" style="position:absolute;left:120px;right:120px;top:210px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-gap:36px"></section>
  <section id="sys" style="position:absolute;left:120px;right:120px;top:696px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-gap:36px"></section>
  <footer style="position:absolute;left:0;right:0;bottom:52px;display:flex;justify-content:center">
    <div class="fp pill" style="display:flex;align-items:center;height:60px;padding:0 30px;border-radius:999px;font-size:19px;font-weight:500">
      <span class="fh" style="display:inline-flex;align-items:center"><span style="display:inline-flex;align-items:center;height:28px;padding:0 9px;border-radius:8px;border:2px solid currentColor;font-size:14px;font-weight:700">OK</span>Tanlash</span>
      <span class="fh" style="display:inline-flex;align-items:center"><span style="width:18px;height:18px;border-radius:999px;background:#E08A7E"></span>YouTube</span>
      <span class="fh" style="display:inline-flex;align-items:center"><span style="width:18px;height:18px;border-radius:999px;background:#7FD3A0"></span>Qidiruv</span>
    </div>
  </footer>
</div>
<script>
var APPS=[
 {id:'youtube',name:'YouTube',sub:'Multfilmlar, musiqa va sevimli kanallar',color:'#B5574B',d:'M3 6.5a2.5 2.5 0 0 1 2.5-2.5h13A2.5 2.5 0 0 1 21 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z M10 9v6l5-3z'},
 {id:'jonli',name:'Jonli TV',sub:'Efir kanallari — yangiliklar va sport',color:'#2F6D7C',d:'M3 7h18v12H3z M8 3l4 4 4-4'},
 {id:'netflix',name:'Netflix',sub:'Kinolar va seriallar butun oila uchun',color:'#7A3B44',d:'M4 4h16v16H4z M8 4v16 M16 4v16 M4 9h4 M4 15h4 M16 9h4 M16 15h4'},
 {id:'galereya',name:'Galereya',sub:'Fleshkadagi oilaviy video va rasmlar',color:'#565C8C',d:'M3 5h18v14H3z M3 16l5-5 4 4 3-3 6 6 M15 9.5h.01'}
];
var SYS=[
 {id:'qurilma',name:'Qurilma',sub:'HDMI / Pristavka',d:'M4 7h16v6l-3 4H7l-3-4z M8 10.5h8 M9 17v3 M15 17v3'},
 {id:'wifi',name:'Wi-Fi',sub:'Tarmoqqa ulanish',d:'M2 8.8a15 15 0 0 1 20 0 M5 12.4a10 10 0 0 1 14 0 M8.5 15.9a5 5 0 0 1 7 0 M12 19.5h.01'},
 {id:'sozlamalar',name:'Sozlamalar',sub:'Til, vaqt, ekran',d:'M4 6h9 M17 6h3 M4 12h3 M11 12h9 M4 18h11 M19 18h1 M15 4v4 M9 10v4 M17 16v4'},
 {id:'ilovalar',name:'Ilovalar',sub:'Barcha ilovalar',d:'M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h6v6h-6z'}
];
// wallpaper palettes: [dark?, [base,band,hill1,hill2,mid,low,lowest], onBorderAccent]
var WP={
kol:[1,['#A9CCCA','#BCD8D5','#7FA6A6','#5F8B8C','#4E7F86','#3D6B5B','#2C5245'],'#E0564C'],
tong:[0,['#E7E3D8','#EFEADE','#D7E0CE','#C3D3B8','#AEC7A6','#8FB49A','#6E9B86'],'#E0772F'],
tun:[1,['#121A2E','#172238','#1E3358','#24406B','#2B4C7D','#1C2F50','#0E1830'],'#5A8FF0'],
ormon:[1,['#9FC2A8','#B2D2B6','#6FA47E','#4E8460','#3C6E4E','#2C5240','#1C3A2C'],'#E0A64C'],
issiq:[0,['#F0DBC0','#F6E6D0','#E8C49A','#E0A878','#D98A5A','#C06A3A','#9B4E2A'],'#E0431F'],
shafaq:[1,['#CDB6E0','#DAC7EC','#A77FD0','#8A5FC0','#6F4CA0','#5A3C8A','#3E2A62'],'#E05EB0'],
dengiz:[1,['#9EC6D8','#B2D6E4','#5F9BC0','#3F7DB0','#2F6090','#234A74','#143050'],'#4FD0E0'],
qumtepa:[0,['#EAD9BE','#F2E6CE','#DCC49A','#CFAE78','#BE925A','#9E723A','#7A552A'],'#C0702F'],
lavanda:[0,['#DCD4EA','#E6E0F2','#C4B6E0','#AE9FD0','#9484C0','#7A6AA8','#5A4C82'],'#8A5FD0'],
tungikol:[1,['#1A2A2E','#203438','#2A4A4E','#346065','#2B4C50','#1C3438','#0E2024'],'#4FD0C8']
};
function qp(n){var m=location.search.match(new RegExp('[?&]'+n+'=([^&]+)'));return m?decodeURIComponent(m[1]):null;}
function palette(){
  var id=qp('wp')||'kol', w=WP[id]||WP.kol, dark=w[0], c=w[1], r=document.documentElement.style;
  r.setProperty('--ui',dark?'#FFFFFF':'#20303A');
  r.setProperty('--ui2',dark?'rgba(255,255,255,0.88)':'rgba(32,48,58,0.82)');
  r.setProperty('--ic',dark?'#CFF1EA':'#2b4a44');
  r.setProperty('--glass',dark?'rgba(18,52,56,0.38)':'rgba(255,255,255,0.42)');
  r.setProperty('--glassb',dark?'rgba(255,255,255,0.28)':'rgba(255,255,255,0.6)');
  r.setProperty('--card',dark?'rgba(18,52,56,0.32)':'rgba(255,255,255,0.5)');
  r.setProperty('--cardb',dark?'rgba(255,255,255,0.4)':'rgba(255,255,255,0.65)');
  r.setProperty('--onbg','rgba(255,255,255,0.94)'); r.setProperty('--onbd',w[2]);
  document.body.style.background=c[0];
  document.getElementById('bg').innerHTML=
   "<rect width=1920 height=1080 fill='"+c[0]+"'/><rect width=1920 height=330 fill='"+c[1]+"'/>"+
   "<path d='M0 470 L220 330 L380 420 L560 280 L760 430 L980 300 L1180 420 L1380 290 L1600 410 L1760 340 L1920 400 V520 H0 Z' fill='"+c[2]+"'/>"+
   "<path d='M0 520 L300 420 L520 490 L820 400 L1100 500 L1400 410 L1700 490 L1920 450 V560 H0 Z' fill='"+c[3]+"'/>"+
   "<rect y=555 width=1920 height=260 fill='"+c[4]+"'/>"+
   "<path d='M0 800 C400 770 800 800 1200 790 S1700 770 1920 790 V1080 H0 Z' fill='"+c[5]+"'/>"+
   "<path d='M0 920 C500 880 1000 920 1500 905 S1800 900 1920 910 V1080 H0 Z' fill='"+c[6]+"'/>";
}
var order=APPS.concat(SYS), focus=0, cards=[];
function svg(d,size){return "<svg width="+size+" height="+size+" viewBox='0 0 24 24' fill=none stroke='#fff' stroke-width='1.9' stroke-linecap=round stroke-linejoin=round><path d='"+d+"'></path></svg>";}
function build(){
  var ap=document.getElementById('apps'), sy=document.getElementById('sys');
  APPS.forEach(function(a){
    var b=document.createElement('button'); b.className='ac'; b.setAttribute('data-id',a.id);
    b.innerHTML="<span class=chip style='background:"+a.color+"'>"+svg(a.d,48)+"</span>"+
      "<span><span class=nm>"+a.name+"</span><div class=sub>"+a.sub+"</div></span>"+
      "<span class=okr><span class=b>OK</span>Ochish</span>";
    b.onclick=function(){launch(a.id)}; ap.appendChild(b); cards.push(b);
  });
  SYS.forEach(function(a){
    var b=document.createElement('button'); b.className='sc'; b.setAttribute('data-id',a.id);
    b.innerHTML="<svg width=34 height=34 viewBox='0 0 24 24' fill=none stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d='"+a.d+"'></path></svg>"+
      "<span><div class=nm>"+a.name+"</div><div class=sub>"+a.sub+"</div></span>";
    b.onclick=function(){launch(a.id)}; sy.appendChild(b); cards.push(b);
  });
  cards[0].classList.add('on');
}
function setFocus(i){ cards[focus].classList.remove('on'); focus=i; cards[focus].classList.add('on'); }
function nav(dir){var r=focus<4?0:1,c=focus%4;
  if(dir=='left')c=Math.max(0,c-1);else if(dir=='right')c=Math.min(3,c+1);
  else if(dir=='up')r=0;else if(dir=='down')r=1; setFocus(r*4+c);}
function ok(){launch(order[focus].id)}
function launch(id){ if(window.Android&&Android.launch)Android.launch(id); }
var DAYS=['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
var MON=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
function tick(){var n=new Date(),p=function(x){return(x<10?'0':'')+x};
  document.getElementById('clock').textContent=p(n.getHours())+':'+p(n.getMinutes());
  document.getElementById('date').textContent=DAYS[n.getDay()]+', '+n.getDate()+'-'+MON[n.getMonth()];}
function fit(){var s=Math.min(window.innerWidth/1920,window.innerHeight/1080);
  document.getElementById('fit').style.transform='translate(-50%,-50%) scale('+s+')';}
window.addEventListener('resize',fit);
palette();build();tick();fit();setInterval(tick,15000);
</script>
</body></html>
